<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Anton&family=Barlow:wght@400;500;600&display=swap');
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: 'Barlow', 'Helvetica Neue', Arial, sans-serif;
      color: #0b0b0c;
      background: #ffffff;
    }
    a { color: #ff5a1f; }
    a:hover { color: #d1430f; }
    .display {
      font-family: 'Anton', 'Barlow', Impact, sans-serif;
      font-weight: 400;
      text-transform: uppercase;
      letter-spacing: 0.01em;
    }
  </style>
</helmet>

<div style="width: 390px; height: 844px; position: relative; overflow: hidden; background: #ffffff">

  <!-- header: black band + court stripe -->
  <div style="display: flex; align-items: center; justify-content: space-between; height: 54px; padding: 0 18px; background: #0b0b0c">
    <span class="display" style="font-size: 17px; color: #ffffff; letter-spacing: 0.06em">Hoops Handbook</span>
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#ff5a1f" stroke-width="1.8">
      <circle cx="12" cy="12" r="9.5"></circle>
      <path d="M12 2.5v19M2.5 12h19"></path>
      <ellipse cx="12" cy="12" rx="4.4" ry="9.5"></ellipse>
    </svg>
  </div>
  <div style="height: 4px; background: #ff5a1f"></div>

  <div style="display: flex; flex-direction: column; gap: 22px; padding: 24px 18px 0">

    <!-- hero -->
    <div style="display: flex; flex-direction: column; gap: 10px">
      <span class="display" style="font-size: 38px; line-height: 0.94">Basketball<br>skills,<br>sorted out.</span>
      <span style="font-size: 14px; line-height: 1.5; color: #6e6e73; max-width: 300px">
        One explanation, the key points, and one video worth watching — per skill.
      </span>
    </div>

    <!-- search: ruled field, no box -->
    <div style="display: flex; align-items: center; gap: 10px; height: 48px; border-bottom: 2px solid #0b0b0c">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#0b0b0c" stroke-width="2.2">
        <circle cx="11" cy="11" r="7"></circle>
        <path d="M20 20l-4.5-4.5"></path>
      </svg>
      <span style="font-size: 15px; color: #9a9aa0">Search skills</span>
    </div>

    <!-- primary action: solid black slab -->
    <div style="display: flex; align-items: center; gap: 14px; padding: 16px 18px; background: #0b0b0c">
      <div style="flex-grow: 1; display: flex; flex-direction: column; gap: 4px">
        <span class="display" style="font-size: 15px; color: #ff5a1f; letter-spacing: 0.08em">Start here</span>
        <span style="font-size: 14px; color: #ffffff">Athletic Stance</span>
      </div>
      <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#ff5a1f" stroke-width="2.4">
        <path d="M5 12h14M13 6l6 6-6 6"></path>
      </svg>
    </div>

    <!-- categories as court-ruled rows -->
    <div style="display: flex; flex-direction: column">
      <span class="display" style="font-size: 12px; letter-spacing: 0.16em; color: #6e6e73; padding-bottom: 10px">Categories</span>

      <div style="display: flex; align-items: center; gap: 14px; padding: 16px 0; border-top: 2px solid #0b0b0c">
        <span style="width: 4px; height: 34px; background: #ff5a1f"></span>
        <span class="display" style="font-size: 26px; flex-grow: 1">Fundamentals</span>
        <span class="display" style="display: inline-flex; align-items: center; justify-content: center; width: 34px; height: 34px; border: 2px solid #0b0b0c; border-radius: 17px; font-size: 14px">9</span>
      </div>

      <div style="display: flex; align-items: center; gap: 14px; padding: 16px 0; border-top: 1px solid #d4d4d8">
        <span style="width: 4px; height: 34px; background: #ff5a1f"></span>
        <span class="display" style="font-size: 26px; flex-grow: 1">Dribbling</span>
        <span class="display" style="display: inline-flex; align-items: center; justify-content: center; width: 34px; height: 34px; border: 2px solid #0b0b0c; border-radius: 17px; font-size: 14px">10</span>
      </div>

      <div style="display: flex; align-items: center; gap: 14px; padding: 16px 0; border-top: 1px solid #d4d4d8; border-bottom: 2px solid #0b0b0c">
        <span style="width: 4px; height: 34px; background: #ff5a1f"></span>
        <span class="display" style="font-size: 26px; flex-grow: 1">Shooting</span>
        <span class="display" style="display: inline-flex; align-items: center; justify-content: center; width: 34px; height: 34px; border: 2px solid #0b0b0c; border-radius: 17px; font-size: 14px">9</span>
      </div>
    </div>

  </div>

  <!-- bottom nav -->
  <div style="position: absolute; left: 0; right: 0; bottom: 0; display: flex; height: 66px; background: #0b0b0c">
    <div style="flex-grow: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; border-top: 4px solid #ff5a1f">
      <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="1.9" stroke-linejoin="round">
        <path d="M3 10.5 12 3l9 7.5V21h-6v-7H9v7H3z"></path>
      </svg>
      <span class="display" style="font-size: 10px; color: #ffffff; letter-spacing: 0.1em">Home</span>
    </div>
    <div style="flex-grow: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; border-top: 4px solid #0b0b0c">
      <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="#7c7c85" stroke-width="1.9" stroke-linecap="round">
        <path d="M4 6h16M4 12h16M4 18h16"></path>
      </svg>
      <span class="display" style="font-size: 10px; color: #7c7c85; letter-spacing: 0.1em">Browse</span>
    </div>
    <div style="flex-grow: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; border-top: 4px solid #0b0b0c">
      <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="#7c7c85" stroke-width="1.9">
        <circle cx="11" cy="11" r="7"></circle>
        <path d="M20 20l-4.5-4.5"></path>
      </svg>
      <span class="display" style="font-size: 10px; color: #7c7c85; letter-spacing: 0.1em">Search</span>
    </div>
  </div>

</div>
</x-dc>
</body>
</html>

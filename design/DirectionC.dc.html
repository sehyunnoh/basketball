<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&display=swap');
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: 'Space Grotesk', 'Segoe UI', sans-serif;
      color: #e8eef4;
      background: #0c1014;
    }
    a { color: #ff6a1a; }
    a:hover { color: #ff8a4d; }
    .thumb {
      background:
        radial-gradient(120% 90% at 30% 20%, #2d3d4a 0%, transparent 60%),
        linear-gradient(145deg, #243039 0%, #171f26 60%, #131a20 100%);
      position: relative;
      overflow: hidden;
    }
    .thumb::after {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(180deg, transparent 40%, rgba(12,16,20,0.85) 100%);
    }
  </style>
</helmet>

<div style="width: 390px; height: 844px; position: relative; overflow: hidden; background: #0c1014">

  <!-- header: quiet, no bar -->
  <div style="display: flex; align-items: center; gap: 9px; padding: 18px 20px 8px">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#ff6a1a" stroke-width="1.7">
      <circle cx="12" cy="12" r="9.5"></circle>
      <path d="M12 2.5v19M2.5 12h19"></path>
      <ellipse cx="12" cy="12" rx="4.4" ry="9.5"></ellipse>
    </svg>
    <span style="font-size: 15px; font-weight: 500; letter-spacing: -0.01em">Hoops Handbook</span>
  </div>

  <div style="display: flex; flex-direction: column; gap: 18px; padding: 10px 20px 0">

    <!-- hero -->
    <div style="display: flex; flex-direction: column; gap: 8px">
      <span style="font-size: 28px; font-weight: 700; line-height: 1.12; letter-spacing: -0.02em">
        Basketball skills,<br>sorted out.
      </span>
      <span style="font-size: 13.5px; line-height: 1.55; color: #8fa0ae">
        Pick a category. One video per skill, already chosen.
      </span>
    </div>

    <!-- search: filled pill -->
    <div style="display: flex; align-items: center; gap: 10px; height: 46px; padding: 0 16px; background: #151b21; border-radius: 23px">
      <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="#8fa0ae" stroke-width="2">
        <circle cx="11" cy="11" r="7"></circle>
        <path d="M20 20l-4.5-4.5"></path>
      </svg>
      <span style="font-size: 14px; color: #8fa0ae">Search skills</span>
    </div>

    <!-- start here: image-led card -->
    <div class="thumb" style="height: 132px; border-radius: 16px; display: flex; flex-direction: column; justify-content: flex-end">
      <div style="position: relative; z-index: 1; display: flex; align-items: flex-end; gap: 12px; padding: 14px 16px">
        <div style="flex-grow: 1; display: flex; flex-direction: column; gap: 4px">
          <span style="font-size: 10.5px; letter-spacing: 0.14em; text-transform: uppercase; color: #ff6a1a">Start here</span>
          <span style="font-size: 18px; font-weight: 500">Athletic Stance</span>
        </div>
        <span style="display: inline-flex; align-items: center; justify-content: center; width: 42px; height: 42px; border-radius: 21px; background: #ff6a1a">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="#0c1014" style="margin-left: 3px">
            <path d="M8 5v14l11-7z"></path>
          </svg>
        </span>
      </div>
    </div>

    <!-- categories: image tiles -->
    <div style="display: flex; flex-direction: column; gap: 10px">
      <span style="font-size: 10.5px; letter-spacing: 0.14em; text-transform: uppercase; color: #6d7d8b">Categories</span>
      <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px">

        <div class="thumb" style="height: 104px; border-radius: 14px; display: flex; flex-direction: column; justify-content: flex-end">
          <div style="position: relative; z-index: 1; padding: 12px">
            <div style="font-size: 15px; font-weight: 500">Fundamentals</div>
            <div style="font-size: 11.5px; color: #8fa0ae; margin-top: 2px">9 skills</div>
          </div>
        </div>

        <div class="thumb" style="height: 104px; border-radius: 14px; display: flex; flex-direction: column; justify-content: flex-end">
          <div style="position: relative; z-index: 1; padding: 12px">
            <div style="font-size: 15px; font-weight: 500">Dribbling</div>
            <div style="font-size: 11.5px; color: #8fa0ae; margin-top: 2px">10 skills</div>
          </div>
        </div>

        <div class="thumb" style="height: 104px; border-radius: 14px; display: flex; flex-direction: column; justify-content: flex-end">
          <div style="position: relative; z-index: 1; padding: 12px">
            <div style="font-size: 15px; font-weight: 500">Shooting</div>
            <div style="font-size: 11.5px; color: #8fa0ae; margin-top: 2px">9 skills</div>
          </div>
        </div>

        <div style="height: 104px; border-radius: 14px; border: 1px dashed #2a343d; display: flex; align-items: center; justify-content: center">
          <span style="font-size: 11.5px; color: #4d5b67; text-align: center; line-height: 1.5">phase 2<br>slots in here</span>
        </div>

      </div>
    </div>

  </div>

  <!-- floating pill nav -->
  <div style="position: absolute; left: 20px; right: 20px; bottom: 18px; display: flex; height: 60px; background: #151b21; border-radius: 30px; padding: 0 6px">
    <div style="flex-grow: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#ff6a1a" stroke-width="1.8" stroke-linejoin="round">
        <path d="M3 10.5 12 3l9 7.5V21h-6v-7H9v7H3z"></path>
      </svg>
      <span style="font-size: 10.5px; color: #ff6a1a">Home</span>
    </div>
    <div style="flex-grow: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#8fa0ae" stroke-width="1.8" stroke-linecap="round">
        <path d="M4 6h16M4 12h16M4 18h16"></path>
      </svg>
      <span style="font-size: 10.5px; color: #8fa0ae">Browse</span>
    </div>
    <div style="flex-grow: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#8fa0ae" stroke-width="1.8">
        <circle cx="11" cy="11" r="7"></circle>
        <path d="M20 20l-4.5-4.5"></path>
      </svg>
      <span style="font-size: 10.5px; color: #8fa0ae">Search</span>
    </div>
  </div>

</div>
</x-dc>
</body>
</html>

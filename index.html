<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

    <title>Hoops Handbook</title>
    <meta
      name="description"
      content="A curated basketball skills library. Categories, levels, and one hand-picked video per skill."
    />

    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <meta name="theme-color" content="#f7f7f5" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#121214" media="(prefers-color-scheme: dark)" />
    <meta name="color-scheme" content="light dark" />

    <!-- iOS "Add to Home Screen" -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Hoops" />

    <link rel="preconnect" href="https://i.ytimg.com" />

    <!--
      GoatCounter: cookie-less, no personal data, nothing to consent to.
      `no_onload` hands counting to src/lib/analytics.ts, which is what makes
      the hash routes show up as separate pages. Forking this? Swap
      hoops-handbook below for the site code you pick at goatcounter.com/signup.
    -->
    <script>
      window.goatcounter = { no_onload: true }
    </script>
    <script
      data-goatcounter="https://hoops-handbook.goatcounter.com/count"
      async
      src="https://gc.zgo.at/count.js"
    ></script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
